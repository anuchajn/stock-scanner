<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>สแกน QR / Barcode</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: 'Segoe UI', sans-serif;
      color: white;
    }

    #app {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }

    #header {
      flex-shrink: 0;
      background: #92C83E;
      padding: 12px;
      text-align: center;
      font-size: 16px;
      font-weight: bold;
      position: relative;
    }

    #btn-torch {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: 2px solid white;
      color: white;
      border-radius: 20px;
      padding: 2px 12px;
      font-size: 13px;
      cursor: pointer;
    }

    #camera-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #000;
      min-height: 0;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #scan-box {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -60%);
      width: min(65vw, 65vh);
      height: min(65vw, 65vh);
      border: 3px solid #92C83E;
      border-radius: 14px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.45);
      pointer-events: none;
    }

    #scan-line {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: #92C83E;
      border-radius: 2px;
      animation: scan 2s linear infinite;
    }

    @keyframes scan {
      0%   { top: 5%; }
      50%  { top: 90%; }
      100% { top: 5%; }
    }

    #bottom {
      flex-shrink: 0;
      background: #1a1a1a;
      padding: 12px 16px;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    #status-bar {
      font-size: 14px;
      color: #ccc;
      text-align: center;
    }

    #result-box {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    #result-text {
      font-size: 18px;
      font-weight: bold;
      color: #92C83E;
      word-break: break-all;
      text-align: center;
    }

    #btn-row {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    #btn-send {
      flex: 1;
      background: #92C83E;
      color: white;
      border: none;
      padding: 11px;
      border-radius: 25px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    #btn-rescan {
      flex: 1;
      background: transparent;
      color: #92C83E;
      border: 2px solid #92C83E;
      padding: 11px;
      border-radius: 25px;
      font-size: 15px;
      cursor: pointer;
    }

    canvas { display: none; }
  </style>
</head>
<body>
<div id="app">
  <div id="header">
    📦 Stock Scanner
    <button id="btn-torch" onclick="toggleTorch()">🔦 ไฟ</button>
  </div>

  <div id="camera-wrap">
    <video id="video" autoplay playsinline muted></video>
    <div id="scan-box">
      <div id="scan-line"></div>
    </div>
  </div>

  <div id="bottom">
    <div id="status-bar">🔍 กำลังเปิดกล้อง...</div>
    <div id="result-box">
      <div id="result-text"></div>
      <div id="btn-row">
        <button id="btn-rescan" onclick="rescan()">🔄 สแกนใหม่</button>
        <button id="btn-send" onclick="sendToChat()">📤 ส่งเข้าแชทบอท</button>
      </div>
    </div>
  </div>
</div>

<canvas id="canvas"></canvas>

<script>
  const LIFF_ID = '2010280134-uKrH9FnT';

  let scanning = true;
  let scannedData = '';
  let stream = null;
  let torchOn = false;

  async function init() {
    try {
      await liff.init({ liffId: LIFF_ID });
      setStatus('🎥 กำลังขอสิทธิ์กล้อง...');

      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      }).then(async (s) => {
        // ตั้ง continuous focus — ถ้าไม่รองรับข้ามเงียบๆ
        try {
          const track = s.getVideoTracks()[0];
          await track.applyConstraints({
            advanced: [{ focusMode: 'continuous' }]
          });
        } catch (_) {}
        return s;
      });

      const video = document.getElementById('video');
      video.srcObject = stream;
      await video.play();

      setStatus('📷 เล็งไปที่ QR Code หรือ Barcode');
      requestAnimationFrame(scanFrame);

    } catch (err) {
      if (err.name === 'NotAllowedError') {
        setStatus('❌ กรุณาอนุญาตกล้องในการตั้งค่า แล้วกดรีโหลด');
      } else {
        setStatus('❌ ' + err.message);
      }
    }
  }

  async function toggleTorch() {
    if (!stream) return;
    try {
      const track = stream.getVideoTracks()[0];
      torchOn = !torchOn;
      await track.applyConstraints({
        advanced: [{ torch: torchOn }]
      });
      const btn = document.getElementById('btn-torch');
      btn.style.background = torchOn ? 'rgba(255,255,255,0.3)' : 'transparent';
      btn.textContent = torchOn ? '🔦 ปิดไฟ' : '🔦 ไฟ';
    } catch (err) {
      setStatus('⚠️ เครื่องนี้ไม่รองรับไฟฉายครับ');
    }
  }

  async function turnOffTorch() {
    if (!stream || !torchOn) return;
    try {
      const track = stream.getVideoTracks()[0];
      await track.applyConstraints({
        advanced: [{ torch: false }]
      });
      torchOn = false;
    } catch (_) {}
  }

  // ปิดไฟอัตโนมัติเมื่อกด Home หรือสลับแอป
  window.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') turnOffTorch();
  });

  // ปิดไฟเมื่อ LIFF ปิดหน้าต่าง
  window.addEventListener('pagehide', () => turnOffTorch());

  function scanFrame() {
    if (!scanning) return;
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');

    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      canvas.width  = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height, {
        inversionAttempts: 'dontInvert'
      });
      if (code && code.data) {
        scanning = false;
        scannedData = code.data;
        showResult(code.data);
        return;
      }
    }
    requestAnimationFrame(scanFrame);
  }

  function showResult(data) {
    setStatus('');
    document.getElementById('result-text').textContent = data;
    document.getElementById('result-box').style.display = 'flex';
  }

  async function sendToChat() {
    const btn = document.getElementById('btn-send');
    btn.textContent = '⏳ กำลังส่ง...';
    btn.disabled = true;
    try {
      await turnOffTorch(); // ปิดไฟก่อนปิดหน้าต่าง
      await liff.sendMessages([{ type: 'text', text: scannedData }]);
      liff.closeWindow();
    } catch (err) {
      btn.textContent = '📤 ส่งเข้าแชทบอท';
      btn.disabled = false;
      setStatus('⚠️ ส่งไม่ได้: ' + err.message);
    }
  }

  function rescan() {
    scannedData = '';
    scanning = true;
    document.getElementById('result-box').style.display = 'none';
    setStatus('📷 เล็งไปที่ QR Code หรือ Barcode');
    requestAnimationFrame(scanFrame);
  }

  function setStatus(msg) {
    document.getElementById('status-bar').textContent = msg;
  }

  init();
</script>
</body>
</html>
